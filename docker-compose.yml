services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: giross
      POSTGRES_PASSWORD: giross
      POSTGRES_DB: giross
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giross -d giross"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run seed"
    environment:
      DATABASE_URL: postgresql://giross:giross@postgres:5432/giross
      SEED_UFS: ${SEED_UFS:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
