services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run seed:container"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_UFS: ${SEED_UFS:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false # Redis down: the seed still loads the base, without clearing the result cache

  api:
    build: .
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      SEARCH_RADIUS_KM: ${SEARCH_RADIUS_KM:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_ADDRESS_SECONDS: ${CACHE_TTL_ADDRESS_SECONDS:-2592000}
      CACHE_TTL_RESULT_SECONDS: ${CACHE_TTL_RESULT_SECONDS:-86400}
      CACHE_TTL_NOT_FOUND_SECONDS: ${CACHE_TTL_NOT_FOUND_SECONDS:-3600}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-bc_giross/1.0 (+https://github.com/owhenrique/bc_giross)}
      CACHE_ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
